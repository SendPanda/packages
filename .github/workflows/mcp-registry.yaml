name: Publish to the MCP Registry

on: workflow_dispatch

permissions: {}

jobs:
  publish:
    if: github.repository == 'SendPanda/packages' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install MCP Publisher
        run: |
          curl --fail --silent --show-error --location --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz
          echo '4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish SendPanda's registry record
        run: |
          ./mcp-publisher validate packages/mcp/server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish packages/mcp/server.json
